<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATER SERVER - STATUS</title>
    <style>
        body {
            background-color: #000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .terminal {
            width: 90%;
            max-width: 650px;
            background: rgba(0, 20, 0, 0.95);
            padding: 30px;
            border: 1px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        h1 { border-bottom: 1px solid #00ff41; padding-bottom: 10px; }

        .status-box {
            background: rgba(0, 255, 65, 0.1);
            padding: 15px;
            margin: 20px 0;
            border-left: 5px solid #00ff41;
        }

        .ip-address {
            background: #222;
            padding: 5px 10px;
            cursor: pointer;
            border: 1px dashed #00ff41;
        }

        .ip-address:hover { background: #333; }

        .discord-btn {
            display: inline-block;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px 20px;
            text-decoration: none;
            margin-top: 10px;
        }

        .discord-btn:hover { background: #00ff41; color: #000; }
        
        #online-count { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>> ATER_SERVER_PORTAL</h1>
        
        <p>[SERVER_INFO]</p>
        <div class="status-box">
            STATUS: <span id="status">CHECKING...</span><br>
            PLAYERS: <span id="online-count">0</span> / <span id="max-count">0</span><br>
            VERSION: 1.20.x (Java/BE)
        </div>

        <p>ADDRESS: <span class="ip-address" onclick="copyIP()">118.27.229.250</span> (Click to Copy)</p>

        <p>>> 掲示板 & 雑談はこちら:</p>
        <a href="https://discord.gg/qYDzxak9" class="discord-btn" target="_blank">DISCORD SERVER</a>
    </div>

    <script>
        // サーバー情報を取得する関数
        async function updateStatus() {
            try {
                const response = await fetch('https://api.mcstatus.io/v2/status/java/118.27.229.250');
                const data = await response.json();
                
                if (data.online) {
                    document.getElementById('status').innerText = 'ONLINE';
                    document.getElementById('status').style.color = '#00ff41';
                    document.getElementById('online-count').innerText = data.players.online;
                    document.getElementById('max-count').innerText = data.players.max;
                } else {
                    document.getElementById('status').innerText = 'OFFLINE';
                    document.getElementById('status').style.color = '#ff0000';
                }
            } catch (error) {
                document.getElementById('status').innerText = 'ERROR';
            }
        }

        // IPをコピーする機能
        function copyIP() {
            navigator.clipboard.writeText('118.27.229.250');
            alert('IPアドレスをコピーしました！');
        }

        // ページ読み込み時に実行
        updateStatus();
        // 60秒ごとに更新
        setInterval(updateStatus, 60000);
    </script>
</body>
</html>
