<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>続きはこちら</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #050505;
    font-family: Inter, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .card {
    width: 420px; max-width: 100%;
    display: flex; gap: 12px; align-items: stretch;
    text-decoration: none; background: #101010;
    border: 1px solid #2b2b2b; border-radius: 14px;
    padding: 12px 12px 12px 14px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: #505050; transform: translateY(-1px); }

  .txt { flex: 1; min-width: 0; }
  .domain { display: flex; align-items: center; gap: 5px; color: #8a8a8a; font-size: 11px; }
  .globe { width: 12px; height: 12px; flex: none; }

  .head { display: flex; align-items: center; gap: 6px; margin: 5px 0 3px; }
  .ttl { font-size: 19px; font-weight: 500; color: #fff; letter-spacing: .02em; }
  .arrow {
    width: 17px; height: 17px; flex: none;
    background: #fe2c55; border-radius: 999px; padding: 3px;
    box-sizing: border-box; transition: transform .15s ease;
  }
  .card:hover .arrow { transform: translateX(2px); }

  .desc { margin: 0; font-size: 12.5px; line-height: 1.5; color: #a8a8a8; }

  .thumb {
    flex: none; width: 86px; border-radius: 10px; background: #000;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .thumb::before, .thumb::after { content: ""; position: absolute; width: 96px; height: 6px; border-radius: 3px; opacity: .85; }
  .thumb::before { background: #25f4ee; top: 16px; left: -20px; transform: rotate(-9deg); }
  .thumb::after { background: #fe2c55; bottom: 16px; right: -22px; transform: rotate(-9deg); }

  .logo { position: relative; width: 42px; height: 42px; }
  .logo::before, .logo::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
  .logo::before { background: #25f4ee; transform: translate(-2.5px, -2px); }
  .logo::after { background: #fe2c55; transform: translate(2.5px, 2px); }
  .logo svg { position: relative; width: 42px; height: 42px; background: #101010; border-radius: 10px; padding: 3px; box-sizing: border-box; }
</style>
</head>
<body>

<a class="card" href="https://lite.tiktok.com/t/ZS9yndvqbXuML-iDItJ/" target="_blank" rel="noopener noreferrer">
  <div class="txt">
    <div class="domain">
      <svg class="globe" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6.2" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
        <ellipse cx="8" cy="8" rx="2.6" ry="6.2" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
        <path d="M1.8 8h12.4" stroke="#8a8a8a" stroke-width="1.2"/>
      </svg>
      <span>lite.tiktok.com</span>
    </div>
    <div class="head">
      <span class="ttl">続きはこちら</span>
      <svg class="arrow" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4 10h11M10.5 5l5 5-5 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="desc">例の動画の真相、まとめました。</p>
  </div>
  <div class="thumb">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect x="27" y="7" width="5" height="27" rx="2.5" fill="#fff"/>
        <circle cx="23" cy="33" r="8" fill="#fff"/>
        <rect x="30" y="6" width="11" height="5" rx="2.5" fill="#fff"/>
      </svg>
    </div>
  </div>
</a>

</body>
</html>
